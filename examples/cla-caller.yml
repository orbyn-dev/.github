# EXAMPLE ONLY, not active. This file lives outside .github/workflows, so it never runs.
# After Anh approves the Agreement and creates the CLA_SIGNATURES_TOKEN org secret, each
# repository owner copies it to .github/workflows/cla.yml in their own repository.
name: Contributor licence agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  cla:
    uses: orbyn-dev/.github/.github/workflows/cla.yml@main
    secrets:
      signatures-token: ${{ secrets.CLA_SIGNATURES_TOKEN }}
