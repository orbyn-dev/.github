# Copy to .github/workflows/licence-grant.yml in a product repository. Then make
# "Licence grant" a required status check on main. Organisation members and bots pass at once.
name: Licence grant

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull:
        description: Pull request number to check again
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  licence-grant:
    uses: orbyn-dev/.github/.github/workflows/licence-grant.yml@SHA_OF_ORBYN_DEV_GITHUB_MAIN
    with:
      pull: ${{ inputs.pull }}
    secrets: inherit
